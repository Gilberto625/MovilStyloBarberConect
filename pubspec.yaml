name: stylo_barber_connect
description: Stylo Barber Connect — aplicación móvil Android (cliente y secretaría).
publish_to: "none"
version: 0.4.1+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.3

dev_dependencies:
  crypto: ^3.0.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  # Fraunces y Manrope empaquetadas (OFL): la app no descarga fuentes.
  assets:
    - assets/google_fonts/
