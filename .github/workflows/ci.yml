name: Mobile CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare evidence folders
        run: |
          mkdir -p build/reports/flutter
          {
            echo "# Stylo Barber Connect Mobile CI"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Runner: $RUNNER_OS"
            echo "- Date UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > build/reports/flutter/ci-summary.md

      - name: Flutter version
        run: flutter --version | tee build/reports/flutter/flutter-version.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart format
        shell: bash
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed . | tee build/reports/flutter/dart-format.log

      - name: Analyze Flutter code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze | tee build/reports/flutter/flutter-analyze.log

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded | tee build/reports/flutter/flutter-test.log

      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-quality-evidence
          path: |
            build/reports/flutter/
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  sast-semgrep:
    name: SAST Semgrep gate
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.95.0,<2.0.0"

      - name: Prepare Semgrep reports
        run: mkdir -p build/reports/semgrep

      - name: Run Semgrep report scan
        run: |
          semgrep scan \
            --strict \
            --metrics=off \
            --config .semgrep.yml \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --json \
            --output build/reports/semgrep/semgrep-report.json \
            .

      - name: Enforce critical SAST policy
        run: |
          semgrep scan \
            --strict \
            --metrics=off \
            --config .semgrep.yml \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --sarif \
            --output build/reports/semgrep/semgrep-blocking.sarif \
            --error \
            .

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('build/reports/semgrep/semgrep-blocking.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/semgrep/semgrep-blocking.sarif
          category: semgrep-mobile

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-evidence
          path: build/reports/semgrep/
          if-no-files-found: warn
          retention-days: 30
