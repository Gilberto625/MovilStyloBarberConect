name: Mobile CI

on:
  pull_request:
    branches:
      - develop
      - release
      - main
  push:
    branches:
      - develop
      - release
      - main
  workflow_dispatch:
    inputs:
      build_release:
        description: "Compilar también el APK release ofuscado (build-release)"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Prepare evidence folders
        run: |
          mkdir -p build/reports/flutter
          {
            echo "# Stylo Barber Connect Mobile CI"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Runner: $RUNNER_OS"
            echo "- Date UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > build/reports/flutter/ci-summary.md

      - name: Flutter version
        run: flutter --version | tee build/reports/flutter/flutter-version.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart format
        shell: bash
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed . | tee build/reports/flutter/dart-format.log

      - name: Analyze Flutter code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze | tee build/reports/flutter/flutter-analyze.log

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded | tee build/reports/flutter/flutter-test.log

      # PR-01: la cobertura no puede bajar del mínimo acordado (sube por hito).
      - name: Coverage gate
        shell: bash
        run: |
          set -o pipefail
          bash tool/coverage_gate.sh 55 | tee build/reports/flutter/coverage-gate.log

      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-quality-evidence
          path: |
            build/reports/flutter/
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  # Comprueba que el release compila con R8 y --obfuscate. Es manual para no
  # alargar cada PR. No sube símbolos, mapping.txt ni el APK: el repo es público.
  build-release:
    name: Release build check (R8 + obfuscate)
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: flutter-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install NDK
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      - name: Build obfuscated release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols/ci

      - name: Verify R8 mapping and Dart obfuscation
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/mapping/release/mapping.txt
          unzip -p build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so > libapp.so
          hits=$(grep -a -o -E 'AuthViewModel|SecretariaGestionViewModel|_tryRefresh' libapp.so | wc -l)
          {
            echo "### Release check"
            echo "- mapping.txt de R8: presente"
            echo "- Nombres de clase Dart visibles en libapp.so: $hits (esperado 0)"
            echo "- SHA-256 del APK: \`$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$hits" -ne 0 ]; then
            echo "::error::libapp.so conserva nombres de clase: --obfuscate no se aplicó."
            exit 1
          fi

  sast-semgrep:
    name: SAST Semgrep gate
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.95.0,<2.0.0"

      - name: Prepare Semgrep reports
        run: mkdir -p build/reports/semgrep

      - name: Run Semgrep report scan
        run: |
          semgrep scan \
            --strict \
            --metrics=off \
            --config .semgrep.yml \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --json \
            --output build/reports/semgrep/semgrep-report.json \
            .

      - name: Enforce critical SAST policy
        run: |
          semgrep scan \
            --strict \
            --metrics=off \
            --config .semgrep.yml \
            --config p/secrets \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --sarif \
            --output build/reports/semgrep/semgrep-blocking.sarif \
            --error \
            .

      - name: Upload SARIF to code scanning
        id: publish-sarif
        if: always() && hashFiles('build/reports/semgrep/semgrep-blocking.sarif') != ''
        # Code Scanning availability must not override the mandatory SAST gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          sarif_file: build/reports/semgrep/semgrep-blocking.sarif
          category: semgrep-mobile

      - name: Report optional SARIF publication failure
        if: always() && steps.publish-sarif.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Optional SARIF publication failed. Check Code Scanning availability and upload logs. Mandatory Semgrep checks remain enforced."
          echo "SARIF publication failed; see upload logs. JSON/SARIF remain in semgrep-sast-evidence. This does not waive any Semgrep gate failure." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sast-evidence
          path: build/reports/semgrep/
          if-no-files-found: warn
          retention-days: 30
