# CD: en release y main compila el AAB y el APK
# firmados con la clave de subida y ofuscados. En main además crea el tag vX.Y.Z y la
# GitHub Release. Necesita los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD y SYMBOLS_PASSPHRASE: sin ellos falla a propósito
# para que nunca salga un release firmado con la clave debug.
name: Release build

on:
  push:
    branches: [release, main] # un PR aprobado y fusionado genera este push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Signed AAB/APK (obfuscated)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # crear tag y GitHub Release en main
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # necesita los tags

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          FULL=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "tag=v${FULL%%+*}" >> "$GITHUB_OUTPUT"

      - name: Version must not be released yet
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG ya existe. Sube 'version' en pubspec.yaml (X.Y.Z y +N) mediante PR a release."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Tests (gate antes de compilar)
        run: flutter test

      - name: Install NDK
        shell: bash
        # Con pipefail, `yes` termina por SIGPIPE cuando sdkmanager acaba y el paso
        # fallaba aunque el NDK sí quedara instalado. Se comprueba la carpeta al final.
        run: |
          NDK="ndk;28.2.13676358"
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$NDK" > /dev/null || true
          fi
          test -d "$ANDROID_HOME/ndk/28.2.13676358" || { echo "::error::No se instaló el NDK 28.2.13676358"; exit 1; }

      - name: Configure signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma. Ver la sección de firma del README"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build AAB and APK (obfuscated)
        shell: bash
        env:
          FULL: ${{ steps.version.outputs.full }}
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info="build/symbols/$FULL"
          flutter build apk       --release --obfuscate --split-debug-info="build/symbols/$FULL"

      - name: Verify signature is not debug
        shell: bash
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee build/signature.txt
          if grep -q "CN=Android Debug" build/signature.txt; then
            echo "::error::El APK quedó firmado con la clave debug."; exit 1
          fi

      - name: Package (symbols encrypted, repo is public)
        shell: bash
        env:
          FULL: ${{ steps.version.outputs.full }}
          SYMBOLS_PASSPHRASE: ${{ secrets.SYMBOLS_PASSPHRASE }}
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/stylo-barber-connect-$FULL.aab"
          cp build/app/outputs/flutter-apk/app-release.apk   "dist/stylo-barber-connect-$FULL.apk"
          tar czf symbols.tgz --ignore-failed-read build/symbols build/app/outputs/mapping/release/mapping.txt
          if [ -n "$SYMBOLS_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$SYMBOLS_PASSPHRASE" \
                -o "dist/symbols-$FULL.tgz.gpg" -c symbols.tgz
          fi
          rm -f symbols.tgz
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-${{ steps.version.outputs.full }}
          path: dist/
          retention-days: 30

      - name: Tag + GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.aab dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Stylo Barber Connect $TAG" --generate-notes
